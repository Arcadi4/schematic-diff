[package]
name = "schematic-diff"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
description = "git diff extension for Minecraft schematic & NBT files"
license = "MIT"
repository = "https://github.com/Arcadi4/schematic-diff"
homepage = "https://github.com/Arcadi4/schematic-diff"
readme = "README.md"
keywords = ["minecraft", "git", "diff", "cli", "terminal"]
categories = ["command-line-utilities", "graphics"]

[[bin]]
name = "schematic-diff"
path = "src/main.rs"

[dependencies]
# Pinned because 0.10.15 through 0.10.24 enable `src/animation/glb.rs` with
# `meshing`, but published `schematic-mesher 0.2.0` lacks the required
# `gltf_build` API.
nucleation = { version = "=0.10.14", default-features = false, features = [
  "meshing",
] }
schematic-mesher = "0.2.0"

# Blockscope remains unpublished, so the litematic backend pins a reviewed
# upstream commit. Replace these with registry versions when the crates ship.
litematic-core = { git = "https://github.com/linvin-1233/blockscope", rev = "f7cefd6cb2a447c7ae217e100a1e8727659bb351", package = "litematic-core" }
litematic-material = { git = "https://github.com/linvin-1233/blockscope", rev = "f7cefd6cb2a447c7ae217e100a1e8727659bb351", package = "litematic-material" }
litematic-mesh = { git = "https://github.com/linvin-1233/blockscope", rev = "f7cefd6cb2a447c7ae217e100a1e8727659bb351", package = "litematic-mesh" }
litematic-render = { git = "https://github.com/linvin-1233/blockscope", rev = "f7cefd6cb2a447c7ae217e100a1e8727659bb351", package = "litematic-render" }
litematic-scene = { git = "https://github.com/linvin-1233/blockscope", rev = "f7cefd6cb2a447c7ae217e100a1e8727659bb351", package = "litematic-scene" }

# Keep this aligned with nucleation so the tree contains one NBT implementation.
quartz_nbt = { version = "0.2.9", features = ["preserve_order"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

rayon = "1.11"
png = "0.18"
base64 = "0.23"

bpaf = { version = "0.9", features = ["derive"] }

libc = "0.2"

# Debug info is the most expensive part of an unoptimized build, and a
# backtrace only needs this crate's line tables to name a source line.
# Dependency debug info is never read, so none of it is generated.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
opt-level = 3
