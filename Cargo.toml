[package]
name = "schematic-diff"
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
description = "git diff extension for Minecraft schematic & NBT files"
license = "MIT"
repository = "https://github.com/Arcadi4/schematic-diff"
readme = "README.md"
keywords = ["minecraft", "git", "diff", "cli", "terminal"]
categories = ["command-line-utilities", "graphics"]

[[bin]]
name = "schematic-diff"
path = "src/main.rs"

[dependencies]
nucleation = { version = "0.12", default-features = false, features = [
  "meshing",
] }
schematic-mesher = "0.2"

# Blockscope crates provide the litematic backend.
blockscope-core = "0.5.2"
blockscope-material = "0.5.2"
blockscope-mesh = "0.5.2"
blockscope-render = "0.5.2"
blockscope-scene = "0.5.2"

# Keep this aligned with nucleation so the tree contains one NBT implementation.
quartz_nbt = { version = "0.2", features = ["preserve_order"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

rayon = "1"
png = "0.18"
base64 = "0.23"

bpaf = { version = "0.9", features = ["derive"] }

libc = "0.2"

# Debug info is the most expensive part of an unoptimized build, and a
# backtrace only needs this crate's line tables to name a source line.
# Dependency debug info is never read, so none of it is generated.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
opt-level = 3
